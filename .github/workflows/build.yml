---
name: Test & Build

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

# Harden against spurious crates.io/curl network failures on hosted runners.
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  test:
    uses: ./.github/workflows/test.yml

  coverage:
    uses: ./.github/workflows/coverage.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The release builds, packages and containerizes the default binary with the same local
  # actions and the same Containerfile stage, on the same two runners, so a broken build
  # leg, package definition or image fails here, on the commit, instead of during a
  # release.
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 60

    strategy:
      matrix:
        include:
          - name: default
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            features: ''
            package: true
          - name: default, aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            features: ''
            package: true
          - name: telemetry
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            features: telemetry
            package: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build
        id: build
        uses: ./.github/actions/build-binary
        with:
          target: ${{ matrix.target }}
          features: ${{ matrix.features }}

      # Strips the binary too, so the archive holds the same binary as the packages.
      - name: Package RPM and DEB
        if: matrix.package
        uses: ./.github/actions/linux-packages
        with:
          target: ${{ matrix.target }}
          package: ${{ steps.build.outputs.name }}
          out: packages

      - name: Package the archive
        if: matrix.package
        uses: ./.github/actions/archive
        with:
          target: ${{ matrix.target }}
          package: ${{ steps.build.outputs.name }}
          version: ${{ steps.build.outputs.version }}

      # Only for the image job below; a release builds its own files.
      - name: Upload the archive
        if: matrix.package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          # Long enough to re-run the image job alone a few days later.
          retention-days: 7

  # The image exactly as a release makes it (both platforms, with provenance and an
  # SBOM), exported instead of pushed. Its index is checked and its amd64 image is run.
  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the package name and version
        id: info
        uses: ./.github/actions/crate-info

      - name: Download the Linux archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: archive-*-unknown-linux-musl
          merge-multiple: true
          path: artifacts

      - name: Stage the image build context
        uses: ./.github/actions/image-context
        with:
          package: ${{ steps.info.outputs.name }}
          version: ${{ steps.info.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Exported as an OCI archive instead of left in the build cache, so the index a
      # release would push exists here and can be inspected and run.
      - name: Build the image for both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: image-context
          file: ./Containerfile
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/image.oci.tar
          provenance: mode=max
          sbom: true

      # Both platforms, and for each its own attestation with an SBOM and provenance:
      # nothing missing, nothing extra, nothing attached to the wrong image.
      - name: Check the image index
        shell: bash
        run: |
          set -euo pipefail
          layout="${RUNNER_TEMP}/image-oci"
          mkdir -p "${layout}"
          tar -xf "${RUNNER_TEMP}/image.oci.tar" -C "${layout}"
          scripts/check-image-index "${layout}"

      # The amd64 image out of that same archive, not a second build.
      - name: Smoke test the image
        shell: bash
        env:
          PACKAGE: ${{ steps.info.outputs.name }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y skopeo; }
          skopeo copy "oci-archive:${RUNNER_TEMP}/image.oci.tar" "docker-daemon:${PACKAGE}:ci"
          out="$(docker run --rm "${PACKAGE}:ci" --version)"
          echo "${out}"
          if [[ "${out}" != *"${VERSION}"* ]]; then
            echo "::error::The image does not report version ${VERSION}."
            exit 1
          fi

  # The same crate checks the release runs, so a package crates.io would refuse (missing
  # metadata, unpublishable files) fails here, not after the release tag exists.
  crate:
    name: Crate
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain

      - name: Package and verify the crate
        run: cargo package --locked

      - name: Check crates.io would accept it
        run: cargo publish --dry-run --locked

  # One aggregate check for branch protection and the release flow: it passes only
  # when every gating job succeeded, so the required check never depends on job or
  # matrix names. Coverage is reported, not a gate: an upload to a coverage service
  # failing must not block a release.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - test
      - build
      - image
      - crate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::A required job finished with '${result}'."
              exit 1
            fi
          done
